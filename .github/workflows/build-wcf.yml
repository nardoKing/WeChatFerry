name: Build WeChatFerry v39.2.4
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source & submodules
        uses: actions/checkout@v5
        with:
          ref: bbbaeb5
          submodules: recursive
          fetch-depth: 0

      - name: Clone vcpkg
        run: git clone --depth=1 https://github.com/microsoft/vcpkg ${{ github.workspace }}\vcpkg
        shell: pwsh

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat
        shell: pwsh

      - name: Install deps
        run: .\vcpkg\vcpkg install spdlog:x64-windows-static nng:x64-windows-static protobuf:x64-windows-static
        shell: pwsh

      - name: Integrate vcpkg
        run: .\vcpkg\vcpkg integrate install
        shell: pwsh

      - name: MSBuild Release x64
        run: |
          "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1" -SkipAutomaticLocation
          msbuild WeChatFerry/WeChatFerry.sln /p:Configuration=Release /p:Platform=x64 /m
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WeChatFerry-bin
          path: WeChatFerry/build/x64/Release
